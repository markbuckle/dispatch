name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v1
        with:
          runtime: node@22
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # tsc errors on an empty include set (TS18003). that's correct
      # behavior when apps/ and packages/ have no .ts files yet, not a
      # bug to work around. scoped to match tsconfig.json's own include
      # list exactly - design/design-system's .tsx files don't count,
      # they're excluded from typecheck the same as they are from lint.
      - name: Typecheck
        run: |
          if git ls-files -- 'apps/**/*.ts' 'apps/**/*.tsx' 'packages/**/*.ts' 'packages/**/*.tsx' | grep -q .; then
            pnpm typecheck
          else
            echo "No TypeScript source files yet, skipping typecheck"
          fi

      - run: pnpm test

      - run: pnpm build